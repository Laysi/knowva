[project]
name = "knowva-inference"
version = "0.1.0"
description = "Embed/rerank service for the Knowva Mac mini appliance; chat goes to Ollama"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=11",
    # The model's remote processing code imports requests directly.
    "requests>=2.32",
    "sentence-transformers>=5.4",
    "torch>=2.9",
    "torchvision>=0.24",
    # The model cards require 4.56 or later.
    "transformers>=4.56",
    "uvicorn>=0.32",
]

[tool.uv]
package = false
# Locked for the one machine this runs on.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# The interpreter comes from proto (.prototools); uv must not fetch its own.
python-preference = "only-system"
python-downloads = "never"
