services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://km:km@postgres:5432/km
      FILES_DIR: /app/backend/data/files
      PORT: "8080"
      CF_AI_GATEWAY_BASE_URL: ${CF_AI_GATEWAY_BASE_URL:-}
      CF_AI_GATEWAY_TOKEN: ${CF_AI_GATEWAY_TOKEN:-}
      GEMMA_4_MODEL_ID: ${GEMMA_4_MODEL_ID:-}
      NEMOTRON_EMBED_MODEL_ID: ${NEMOTRON_EMBED_MODEL_ID:-nvidia/llama-nemotron-embed-vl-1b-v2}
      NEMOTRON_RERANK_MODEL_ID: ${NEMOTRON_RERANK_MODEL_ID:-nvidia/llama-nemotron-rerank-vl-1b-v2}
      RERANK_CANDIDATE_TOP_K: ${RERANK_CANDIDATE_TOP_K:-50}
      RERANK_TOP_N: ${RERANK_TOP_N:-6}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-8}
      CLOUD_CHAT_URL: ${CLOUD_CHAT_URL:-}
      CLOUD_EMBED_URL: ${CLOUD_EMBED_URL:-}
      CLOUD_RERANK_URL: ${CLOUD_RERANK_URL:-}
      CLOUD_MODEL_REQUEST_TIMEOUT_SECS: ${CLOUD_MODEL_REQUEST_TIMEOUT_SECS:-120}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-180}
      DOCUMENT_CONVERSION_TIMEOUT_SECS: ${DOCUMENT_CONVERSION_TIMEOUT_SECS:-120}
      PDFIUM_LIBRARY_PATH: /usr/local/lib/libpdfium.so
      LIBREOFFICE_BIN: /usr/bin/libreoffice
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app_files:/app/backend/data/files

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: km
      POSTGRES_PASSWORD: km
      POSTGRES_DB: km
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U km"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_files:
  pgdata:
