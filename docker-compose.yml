services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://knowva:knowva@postgres:5432/knowva
      FILES_DIR: /app/backend/data/files
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_ALLOW_HTTP: ${STORAGE_ALLOW_HTTP:-}
      STORAGE_TIMEOUT: ${STORAGE_TIMEOUT:-}
      PORT: "8080"
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_TOKEN: ${MODEL_API_TOKEN:-}
      GEMMA_4_MODEL_ID: ${GEMMA_4_MODEL_ID:-}
      NEMOTRON_EMBED_MODEL_ID: ${NEMOTRON_EMBED_MODEL_ID:-nvidia/llama-nemotron-embed-vl-1b-v2}
      NEMOTRON_RERANK_MODEL_ID: ${NEMOTRON_RERANK_MODEL_ID:-nvidia/llama-nemotron-rerank-vl-1b-v2}
      RERANK_CANDIDATE_TOP_K: ${RERANK_CANDIDATE_TOP_K:-50}
      RERANK_TOP_N: ${RERANK_TOP_N:-6}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-8}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      MODEL_CHAT_URL: ${MODEL_CHAT_URL:-}
      MODEL_EMBED_URL: ${MODEL_EMBED_URL:-}
      MODEL_RERANK_URL: ${MODEL_RERANK_URL:-}
      MODEL_REQUEST_TIMEOUT_SECS: ${MODEL_REQUEST_TIMEOUT_SECS:-120}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-180}
      DOCUMENT_CONVERSION_TIMEOUT_SECS: ${DOCUMENT_CONVERSION_TIMEOUT_SECS:-120}
      PDFIUM_LIBRARY_PATH: /usr/local/lib/libpdfium.so
      LIBREOFFICE_BIN: /usr/bin/libreoffice
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app_files:/app/backend/data/files

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: knowva
      POSTGRES_PASSWORD: knowva
      POSTGRES_DB: knowva
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowva"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional S3-compatible storage for local verification only:
  #   docker compose --profile minio up -d minio minio-init
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["minio"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowvaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knowvaminio-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["minio"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowvaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knowvaminio-secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-knowva-files}
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null; do sleep 1; done
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"

volumes:
  app_files:
  pgdata:
