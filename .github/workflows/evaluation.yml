name: Evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Check Rust formatting
        run: proto exec rust -- cargo fmt --check

      - name: Lint Rust targets
        run: proto exec rust -- cargo clippy --all-targets -- -D warnings

      - name: Test evaluation modules
        run: proto exec rust -- cargo test evaluation::

      - name: Validate evaluation fixtures
        run: proto exec rust -- cargo run -- eval --dry-run
