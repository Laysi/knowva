# Deploys a published version onto ai-km-server.
#
#   gh workflow run deploy.yml -f version=0.1.0
#
# Only ever run by hand. release.yml builds an image on a version tag and stops
# there, so nothing reaches the host until someone dispatches this with the
# version to put on it -- the same gesture that redeploys, or rolls back to any
# version already in ghcr.io.
#
# The host sits behind a Cloudflare tunnel and publishes no inbound port, so the
# runner reaches it through `cloudflared access ssh`. The host key is pinned
# rather than trusted on first use: the tunnel is reachable by anyone, and the
# host key is what proves this is the right machine.
#
# The host keeps no long-lived registry credential. It is logged in to ghcr.io
# with this run's own GITHUB_TOKEN for the length of the pull and logged out
# afterwards, so rotating anything is a change here rather than on the Pi.
# Pulling rather than streaming `docker save` over the tunnel matters at this
# image size: it carries LibreOffice and the CJK fonts, and a pull moves only
# the layers that changed, which is usually the binary and the frontend bundle.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to deploy
        default: latest

permissions:
  contents: read
  packages: read

env:
  DEPLOY_HOST: one-ssh.laysi.io
  DEPLOY_USER: ai-km
  # The existing install, whose named volumes and Cloudflare tunnel are already
  # bound to this project name.
  DEPLOY_DIR: app
  PROJECT: app
  SITE: https://ai-km.laysi.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          set -eu
          curl -fsSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Configure ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s ssh-ed25519 %s\n' "$DEPLOY_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIC604ENTjAQN0XSpM17AYa8XZUds/bMxrTTDIs1dIxsP' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
              User $DEPLOY_USER
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Send the compose file and the environment
        env:
          VERSION: ${{ inputs.version }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CF_AI_GATEWAY_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          CF_AI_GATEWAY_BASE_URL: ${{ secrets.CF_AI_GATEWAY_BASE_URL }}
          GEMMA_4_MODEL_ID: ${{ secrets.GEMMA_4_MODEL_ID }}
          # File storage is chosen once, by the first start against an empty
          # database, and locked there. It lives in repository variables and
          # secrets rather than in a dispatch input so every later deployment
          # repeats the same choice: a mismatch makes the backend refuse to
          # start, and changing it means re-initializing the database and the
          # storage. Unset means local, which is what the existing host is
          # locked to.
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_PREFIX: ${{ vars.STORAGE_PREFIX }}
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ vars.STORAGE_REGION }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          # Checked before the host is touched: a backend that refuses its
          # storage settings takes the running site down with it.
          case "${STORAGE_BACKEND:-local}" in
              local) ;;
              s3) [ -n "${STORAGE_BUCKET:-}" ] || { echo "STORAGE_BUCKET is required when STORAGE_BACKEND=s3"; exit 1; } ;;
              *) echo "STORAGE_BACKEND must be local or s3"; exit 1 ;;
          esac
          # metadata-action publishes `{{version}}`, which drops the tag's `v`,
          # so release.yml can hand this workflow its own ref_name unchanged and
          # a person can type either form.
          KM_VERSION=${VERSION#v}
          # The whole file is secret material. The Cloudflare tunnel is not in
          # it: that runs as its own project on the host, serves every site on
          # the machine, and is not this deployment's to configure.
          umask 077
          cat > env.deploy <<EOF
          KM_VERSION=$KM_VERSION
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          CF_AI_GATEWAY_TOKEN=$CF_AI_GATEWAY_TOKEN
          CF_AI_GATEWAY_BASE_URL=$CF_AI_GATEWAY_BASE_URL
          GEMMA_4_MODEL_ID=$GEMMA_4_MODEL_ID
          STORAGE_BACKEND=$STORAGE_BACKEND
          STORAGE_BUCKET=$STORAGE_BUCKET
          STORAGE_PREFIX=$STORAGE_PREFIX
          STORAGE_ENDPOINT=$STORAGE_ENDPOINT
          STORAGE_REGION=$STORAGE_REGION
          STORAGE_ACCESS_KEY_ID=$STORAGE_ACCESS_KEY_ID
          STORAGE_SECRET_ACCESS_KEY=$STORAGE_SECRET_ACCESS_KEY
          EOF
          ssh "$DEPLOY_HOST" "mkdir -p $DEPLOY_DIR"
          scp docker-compose.prod.yml "$DEPLOY_HOST:$DEPLOY_DIR/"
          scp env.deploy "$DEPLOY_HOST:$DEPLOY_DIR/.env"
          rm -f env.deploy

      - name: Pull the image and restart the stack
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | \
            ssh "$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # Pull and restart both run detached on the host, because neither
          # survives being held over this ssh session. The image carries
          # LibreOffice and the CJK fonts, and pulling it moves that much data
          # through the very tunnel the session rides on, starving the
          # connection until it breaks mid-download; recreating the stack then
          # resets the network the tunnel container joins. So the host runs the
          # whole thing alone and the step below finds out how it went.
          #
          # The script logs the host out as its last act rather than this job
          # doing it on exit: this step returns while the pull is still running,
          # and removing the credential then would break the very pull it is
          # meant to clean up after. The next step runs on every path and logs
          # out too, so a failed pull still leaves nothing behind.
          #
          # No --remove-orphans: the tunnel belongs to another project and would
          # not match it, but nothing gained here is worth any chance of
          # deleting the container that serves every other site on the machine.
          cat > deploy.sh <<EOF
          #!/bin/sh
          set -eu
          cd "\$HOME/$DEPLOY_DIR"
          docker compose -p $PROJECT -f docker-compose.prod.yml pull
          docker compose -p $PROJECT -f docker-compose.prod.yml up -d
          docker logout ghcr.io
          EOF
          scp deploy.sh "$DEPLOY_HOST:$DEPLOY_DIR/deploy.sh"
          rm -f deploy.sh
          # The launcher only has to start the script; its own exit status says
          # nothing about how the deployment went. Holding the channel open for
          # a backgrounded child -- which the trailing `sleep` did -- is what
          # returned 255 on a deployment that had in fact succeeded. Braces keep
          # the redirection with the child, `-n` keeps stdin off the channel,
          # and the explicit `exit 0` makes the launcher's result deterministic.
          # deploy.status, read by the step below, is the real verdict.
          ssh -n "$DEPLOY_HOST" "cd $DEPLOY_DIR && rm -f deploy.status && chmod +x deploy.sh && \
            { setsid nohup sh -c './deploy.sh; echo \$? > deploy.status' \
              > deploy.log 2>&1 < /dev/null & } ; exit 0"

      - name: Wait for the site
        # Runs even when the step above failed, so a deployment that never
        # started still has its logs read and its credential removed.
        if: always()
        run: |
          set -eu
          ok=
          for _ in $(seq 120); do
              status=$(ssh -o ConnectTimeout=15 "$DEPLOY_HOST" \
                "cat $DEPLOY_DIR/deploy.status 2>/dev/null" 2>/dev/null || echo "")
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE/api/health" || echo 000)
              echo "host script: ${status:-running}   $SITE/api/health -> $code"
              if [ "$code" = 200 ]; then
                  ok=yes
                  break
              fi
              # The script writes its exit code when it finishes. A non-zero one
              # means the pull or the restart failed, and no further polling is
              # going to produce a site.
              if [ -n "$status" ] && [ "$status" != 0 ]; then
                  echo "the host script exited $status"
                  break
              fi
              sleep 10
          done
          # Runs whichever way the poll went: the logs are the only account of a
          # deployment that never came up, and the credential must not outlive
          # the run even when the host script never reached its own logout.
          ssh -o ConnectTimeout=15 "$DEPLOY_HOST" "cd $DEPLOY_DIR && \
            docker compose -p $PROJECT -f docker-compose.prod.yml ps; \
            tail -30 deploy.log 2>/dev/null; \
            docker logout ghcr.io" || true
          [ "$ok" = yes ] || { echo "the site never returned 200"; exit 1; }
