# Publishes the deployment image on a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# One multi-platform image goes to ghcr.io, tagged with the version and with
# `latest`. arm64 is what the deployment host, an aarch64 Raspberry Pi, pulls;
# amd64 is for running the same published image on an ordinary x86 machine.
#
# The organisation is on the free plan with a private repository, so no hosted
# arm64 runner is available. The Dockerfile keeps the npm build, the Pdfium
# download and the cargo build on the runner's own architecture and cross-links
# the binary, leaving only the arm64 runtime stage to be emulated -- and all
# that stage does is unpack LibreOffice and the CJK fonts. amd64 is the
# runner's own architecture and is emulated nowhere, so the added cost is a
# second cargo release build, which runs concurrently with the first.
#
# Building is all this does. Putting an image on the host is a separate act:
#
#   gh workflow run deploy.yml -f version=0.1.0
#
# Nothing here waits for CI, and CI never runs on the tag: ci.yml triggers on
# `push: branches: [main]`, which a tag push does not match. So this builds an
# image from whatever the tag points at, green or not. An unreviewed tag now
# costs a wasted build rather than a deployment, because reaching the host
# takes a second, deliberate decision -- which is where the check belongs.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the owner, which ghcr.io requires, and emits the
      # org.opencontainers.image.* labels that link the package back here.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cargo keeps its target directory on a cache mount, which no registry
          # cache carries, so the backend compiles from scratch on every run;
          # this saves the base layers and the apt stages only.
          cache-from: type=gha
          cache-to: type=gha,mode=max
