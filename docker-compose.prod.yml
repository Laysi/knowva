# Production deployment from pre-built images, published by
# .github/workflows/release.yml on a version tag and deployed by
# .github/workflows/deploy.yml.
#
# This replaces building on the host. The target is a Raspberry Pi with four
# cores and 3.7 GB of RAM on an SD card, where a release build of the backend
# is neither fast nor reliable, and a failed build leaves the service down.
#
# Deployed to ~/app under the project name `app`, which is what the existing
# named volumes and the Cloudflare tunnel are already bound to. Keeping both
# is deliberate: renaming the project would orphan app_pgdata and app_app_files
# behind a new prefix.
#
# Nothing publishes a port. The Cloudflare tunnel runs as its own compose
# project on the host and joins this project's default network, so it reaches
# the backend by service name and neither the application nor the database is
# exposed on the host's LAN.
#
# The tunnel is deliberately not defined here. It carries every site on that
# machine, so tying its lifecycle to this stack takes them all down on a
# deployment -- which is also why the service name and the project name are
# fixed: the tunnel resolves the backend as `app` on `app_default`.
#
#   docker compose -p app -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/laysi/knowva:${KNOWVA_VERSION:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://knowva:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/knowva
      FILES_DIR: /app/backend/data/files
      PORT: "8080"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_ALLOW_HTTP: "false"
      # Uploads leave the Pi over a home uplink; the 30s default cuts off a
      # 50 MiB original.
      STORAGE_TIMEOUT: 120s
      # Fails the container before it accepts traffic rather than at the first
      # chat request, which is what cloud_models.rs parses these for.
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_TOKEN: ${MODEL_API_TOKEN:-}
      GEMMA_4_MODEL_ID: ${GEMMA_4_MODEL_ID:?set GEMMA_4_MODEL_ID}
      NEMOTRON_EMBED_MODEL_ID: ${NEMOTRON_EMBED_MODEL_ID:-nvidia/llama-nemotron-embed-vl-1b-v2}
      NEMOTRON_RERANK_MODEL_ID: ${NEMOTRON_RERANK_MODEL_ID:-nvidia/llama-nemotron-rerank-vl-1b-v2}
      RERANK_CANDIDATE_TOP_K: ${RERANK_CANDIDATE_TOP_K:-50}
      RERANK_TOP_N: ${RERANK_TOP_N:-6}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-8}
      MODEL_CHAT_URL: ${MODEL_CHAT_URL:-}
      MODEL_EMBED_URL: ${MODEL_EMBED_URL:-}
      MODEL_RERANK_URL: ${MODEL_RERANK_URL:-}
      MODEL_REQUEST_TIMEOUT_SECS: ${MODEL_REQUEST_TIMEOUT_SECS:-120}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-180}
      DOCUMENT_CONVERSION_TIMEOUT_SECS: ${DOCUMENT_CONVERSION_TIMEOUT_SECS:-120}
      # Industry profile baked into the image; an unknown one stops the container.
      KNOWVA_PROFILE: ${KNOWVA_PROFILE:-default}
    volumes:
      - app_files:/app/backend/data/files

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: knowva
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowva"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_files:
  pgdata:
