[package]
name = "knowva-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.32"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
object_store = { version = "0.13.2", features = ["aws"] }
pdfium-render = { git = "https://github.com/ajrcarey/pdfium-render.git", rev = "4250dbd2bb97dabc0bd25fd4d678925f7845cc32", default-features = false, features = ["pdfium_7763", "image_latest", "thread_safe"] }
pgvector = { version = "0.4.2", features = ["sqlx", "halfvec"] }
regex = "1.11.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tower-http = { version = "0.7.0", features = ["fs", "limit", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

# Full debug info is the largest single thing a test build writes and links, and
# none of it is read here: failures are diagnosed from panic backtraces, which
# line tables alone are enough to resolve to a file and a line. This shrinks the
# cached target directory as much as it shortens the build. The release profile,
# which is what ships, is untouched.
[profile.dev]
debug = "line-tables-only"
